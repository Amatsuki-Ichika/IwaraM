# Dependency updates arrive as pull requests that run the normal checks: the build job in
# ci.yml and the repository gates. Nothing is merged automatically; each grouped PR is reviewed
# and verified with a build like any human change.
version: 2

updates:
  # Action versions are part of the release supply chain. One grouped PR per week keeps the
  # major versions moving without one PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Gradle dependencies are centralised in gradle/libs.versions.toml, so minor and patch bumps
  # share one PR and one debug build. Major bumps stay separate: they need a decision and a
  # wider verification pass.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
