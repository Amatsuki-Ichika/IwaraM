name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fast gate first: docs and repository hygiene fail in seconds, before Gradle warms up.
      - name: Repository gates
        run: node scripts/check.mjs

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      # Size ratchet reads app/build/outputs/apk/debug; it must run after assembleDebug.
      - name: APK size ratchet
        run: node scripts/verify-apk-size.mjs

      # Phase 3 (optional): enable unit-test coverage in app/build.gradle.kts, then:
      # - name: Coverage report
      #   run: ./gradlew :app:createDebugUnitTestCoverageReport --no-daemon
      # - uses: actions/upload-artifact@v4
      #   with: { name: coverage, path: app/build/reports/coverage/** }
      # Gate on a recorded baseline, not on an absolute target: fail only when coverage drops.
