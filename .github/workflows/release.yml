name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Build signed release
        run: ./gradlew :app:assembleRelease -Papp.versionName="$VERSION" --no-daemon

      - name: Rename and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "iwara-manager-$VERSION-arm64-v8a.apk"
          sha256sum "iwara-manager-$VERSION-arm64-v8a.apk" > "iwara-manager-$VERSION-arm64-v8a.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            iwara-manager-*.apk
            iwara-manager-*.apk.sha256
          generate_release_notes: true
