name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history so all tags are available when computing the release-notes base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can be pushed for any commit, and the tag checkout does not guarantee an
      # origin/main ref; fetch main explicitly, then require the tagged commit to be part of
      # it. A release must ship a reviewed, merged commit, not a commit on a side branch.
      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Tag a commit that is already merged into main."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The same repository gates CI runs on every pull request, re-run on the exact commit
      # being released: documentation and repository hygiene, independent of what CI saw.
      - name: Repository gates
        run: node scripts/check.mjs

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Check tag matches gradle.properties
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # A release tag is vMAJOR.MINOR.PATCH with an optional pre-release suffix (the RC
          # stage, for example v0.2.3-rc.1). Leading zeros are rejected so two spellings can
          # never name the same version and string equality stays semantic equality.
          TAG_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ ! "$TAG_NAME" =~ $TAG_PATTERN ]]; then
            echo "::error::Tag '$TAG_NAME' is not a semantic release tag. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, for example v0.2.3 or v0.2.3-rc.1."
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          PROPS_VERSION="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          PROPS_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ ! "$PROPS_VERSION" =~ $PROPS_PATTERN ]]; then
            echo "::error::app.versionName=$PROPS_VERSION in gradle.properties is not a semantic version. Expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease."
            exit 1
          fi
          # Compare semantically, not bytewise, so a mismatch explains which side moved. The tag
          # must name exactly the version the build reports: never tag an older commit with a
          # newer version, and never bump only the tag. The numeric core is ordered with sort -V;
          # a differing pre-release suffix is a separate case because sort -V does not order
          # pre-releases the way semantic versioning does.
          if [ "$VERSION" != "$PROPS_VERSION" ]; then
            TAG_CORE="${VERSION%%-*}"
            PROPS_CORE="${PROPS_VERSION%%-*}"
            if [ "$TAG_CORE" != "$PROPS_CORE" ]; then
              NEWEST="$(printf '%s\n%s\n' "$TAG_CORE" "$PROPS_CORE" | sort -V | tail -n1)"
              if [ "$NEWEST" = "$TAG_CORE" ]; then
                echo "::error::Tag '$TAG_NAME' is newer than app.versionName=$PROPS_VERSION in gradle.properties. Set app.versionName=$VERSION before tagging."
              else
                echo "::error::Tag '$TAG_NAME' is older than app.versionName=$PROPS_VERSION in gradle.properties. Tag the version the build reports, and never move an existing tag."
              fi
            else
              echo "::error::Tag '$TAG_NAME' and app.versionName=$PROPS_VERSION in gradle.properties name the same core version with different pre-release suffixes. Make them identical."
            fi
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Base for the generated release notes: the newest stable tag before this one, so a
          # stable release's notes cover everything since the previous stable (RC tags skipped,
          # a pre-release's notes cover the full delta since the last stable).
          # `|| true` guards against grep's no-match exit under pipefail on the first release.
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-creatordate | grep -ve '-' | grep -Fvx "v$VERSION" | head -n1 || true)"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf '%s\n' \
            "storeFile=keystore/release.jks" \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Build signed release
        run: ./gradlew :app:assembleRelease -Papp.versionName="$VERSION" --no-daemon

      - name: Verify signed APK
        env:
          # 与 SECURITY.md 的 "Signing certificate" 同一枚指纹；换 key 时两处必须同时改。
          EXPECTED_CERT_SHA256: "f4d78c505dfaf5275cd0a214a0e5a76874c052218a8393e61322ae54bcef75f6"
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          if [ -z "$ACTUAL" ]; then
            echo "无法从 apksigner 输出里读到证书指纹"; exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "签名指纹不符：期望 $EXPECTED_CERT_SHA256，实际 $ACTUAL"; exit 1
          fi

      # CI builds the debug variant only, so this is the only place the release entry in
      # scripts/apk-size-baseline.json can hold the release APK to its budget.
      - name: Release APK size ratchet
        run: node scripts/verify-apk-size.mjs

      - name: Rename and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "IwaraM-$VERSION-arm64-v8a.apk"
          sha256sum "IwaraM-$VERSION-arm64-v8a.apk" > "IwaraM-$VERSION-arm64-v8a.apk.sha256"

      # Curated release body: the CHANGELOG section for this version, falling back to the
      # [Unreleased] section while a pre-release has no versioned section yet, followed by the
      # subjects of the non-merge commits since the previous stable tag. Built locally instead of
      # generate_release_notes so entries stay author-free (single-maintainer repo; matches the
      # curated CHANGELOG style). The repository merges with merge commits and never squashes, so
      # --no-merges drops "Merge pull request #N" and keeps the authored subjects.
      - name: Build release body
        run: |
          section() {
            awk -v header="## [$1]" 'index($0, header) == 1 { flag = 1; next } /^## / { flag = 0 } flag' CHANGELOG.md
          }
          BODY="$(section "$VERSION")"
          if [ -z "$BODY" ]; then
            BODY="$(section Unreleased)"
          fi
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](https://github.com/Amatsuki-Ichika/IwaraM/blob/main/CHANGELOG.md) for what is new in this release."
          fi
          RANGE="${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD"
          LIST="$(git log "$RANGE" --reverse --no-merges --pretty=format:'- %s')"
          {
            echo "RELEASE_BODY<<EOF"
            echo "$BODY"
            echo ""
            echo "## What's Changed"
            echo ""
            echo "$LIST"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/Amatsuki-Ichika/IwaraM/compare/$PREVIOUS_TAG...v$VERSION"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            IwaraM-*.apk
            IwaraM-*.apk.sha256
          body: ${{ env.RELEASE_BODY }}
          # A semver pre-release suffix in the tag (e.g. v0.2.0-rc.1) publishes as a GitHub
          # pre-release, which is excluded from "Latest" and /releases/latest; a plain
          # vMAJOR.MINOR.PATCH tag publishes as stable and becomes "Latest" automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
