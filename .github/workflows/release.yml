name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history so all tags are available when computing the release-notes base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Check tag matches gradle.properties
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_VERSION#v}"
          PROPS_VERSION="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          if [ "$VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match app.versionName=$PROPS_VERSION in gradle.properties. Bump gradle.properties before tagging."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Base for the generated release notes: the newest stable tag before this one, so a
          # stable release's notes cover everything since the previous stable (RC tags skipped,
          # a pre-release's notes cover the full delta since the last stable).
          # `|| true` guards against grep's no-match exit under pipefail on the first release.
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-creatordate | grep -ve '-' | grep -Fvx "v$VERSION" | head -n1 || true)"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"

      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf '%s\n' \
            "storeFile=keystore/release.jks" \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Build signed release
        run: ./gradlew :app:assembleRelease -Papp.versionName="$VERSION" --no-daemon

      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "IwaraM-$VERSION-arm64-v8a.apk"
          sha256sum "IwaraM-$VERSION-arm64-v8a.apk" > "IwaraM-$VERSION-arm64-v8a.apk.sha256"

      # Curated release body: the CHANGELOG section for this version, so the published page
      # leads with user-facing highlights; generate_release_notes appends the auto-generated
      # "What's Changed" list after it. Falls back to a pointer if the section is missing.
      - name: Extract changelog section for the release body
        run: |
          BODY="$(awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 { flag = 1; next } /^## / { flag = 0 } flag' CHANGELOG.md)"
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](https://github.com/Amatsuki-Ichika/IwaraM/blob/main/CHANGELOG.md) for what is new in this release."
          fi
          {
            echo "RELEASE_BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            IwaraM-*.apk
            IwaraM-*.apk.sha256
          body: ${{ env.RELEASE_BODY }}
          generate_release_notes: true
          previous_tag: ${{ env.PREVIOUS_TAG }}
          # A semver pre-release suffix in the tag (e.g. v0.2.0-rc.1) publishes as a GitHub
          # pre-release, which is excluded from "Latest" and /releases/latest; a plain
          # vMAJOR.MINOR.PATCH tag publishes as stable and becomes "Latest" automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
