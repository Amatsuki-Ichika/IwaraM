# Gradle daemon JVM options. `-Dfile.encoding=UTF-8` keeps Kotlin sources readable on
# Windows machines whose console defaults to a legacy code page.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# Run the Kotlin compiler in-process to avoid a second long-lived daemon.
kotlin.compiler.execution.strategy=in-process

# compileSdk 37 is above the AGP-recommended maximum; silence the resulting warning.
android.suppressUnsupportedCompileSdk=37

# App version — single source of truth (also overridable via -P on the command line).
app.versionCode=1
app.versionName=0.1.0
